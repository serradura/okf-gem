# The repo-level Ruby only: this repo's own Rakefile and the Claude Code
# plugin's curation hook. Every gem lints itself through its own .rubocop.yml,
# which is what `cd gems/okf && bundle exec rake` and CI run — this file exists
# because those two files sit outside every gem and the move into gems/ left
# them linted by nobody.
#
# The house style is the gem's, inherited rather than restated so the two cannot
# drift. That also carries the 2.4 target, which is right: the curation hook is
# plain stdlib Ruby held to the same floor.
inherit_from: gems/okf/.rubocop.yml

# inherit_mode keeps RuboCop's own AllCops defaults (node_modules/, vendor/,
# .git/ …) instead of replacing them with just these two — the same reason the
# gem's config uses it on Metrics/BlockLength.
#
# One `gems/**/*` entry replaces the four-gem enumeration this list used to
# carry: an enumeration is only as true as the last person to remember it, and
# a fifth gem arriving under gems/ now excludes itself.
AllCops:
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    - "gems/**/*"
    - "tmp/**/*"
